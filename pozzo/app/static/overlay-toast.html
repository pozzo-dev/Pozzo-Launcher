<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Pozzo Toast</title>
<link rel="stylesheet" href="/static/app.css?v={{v}}">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI", system-ui, sans-serif; }
  #t { display: none; align-items: center; gap: 14px; margin: 6px; padding: 12px 16px; max-height: 118px; box-sizing: border-box;
    border-radius: 12px; color: var(--text); background: color-mix(in srgb, var(--bg-2) 95%, transparent);
    border: 1px solid var(--accent); box-shadow: 0 6px 24px rgba(0, 0, 0, .5); }
  #t.on { display: flex; animation: in .25s ease-out; }
  @keyframes in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  img { width: 56px; height: 56px; flex: none; border-radius: 8px; object-fit: cover; } img[hidden] { display: none; }
  small { color: var(--accent); display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  #t > div { min-width: 0; }
  b { display: block; font-size: 17px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  span { font-size: 13px; line-height: 1.35; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
  html[data-motion="off"] #t.on, html[data-motion="reduced"] #t.on { animation: none; }
  @media (prefers-reduced-motion: reduce) { html:not([data-motion="normal"]) #t.on { animation: none; } }
</style>
<script src="/static/overlay-boot.js?v={{v}}"></script>
</head>
<body>
<div role="status" aria-live="polite"><div id="t"><img id="i" alt="" hidden><div><small id="k"></small><b id="n"></b><span id="d"></span></div></div></div>
<script src="/static/i18n.js?v={{v}}"></script>
<script src="/static/overlay-toast.js?v={{v}}"></script>
</body>
</html>
