[plugin]
name = "Il mio PC ce la fa?"
version = "2.0"
author = "Pozzo Launcher"
icon = "▤"
screenshot = "screenshot.png"
description = "Nella scheda di ogni gioco un semaforo ti dice se il tuo PC lo regge, con tre indicatori (processore, scheda video, memoria) e le impostazioni consigliate per gli emulatori."
long_description = "Confronta il tuo hardware con i requisiti del gioco: per i giochi Steam usa i requisiti minimi e consigliati dello store, per le console emulate quelli tipici dell'emulatore. Il risultato è un semaforo (verde, giallo, rosso) e tre barre che mostrano dove sei rispetto al minimo e al consigliato. Se serve, trovi le impostazioni da cambiare per farlo girare meglio."
how_it_works = "1. Installa l'estensione e apri la scheda di un gioco.\n2. Nella sezione «Il mio PC ce la fa?» trovi il semaforo e le tre barre.\n3. Le tacche sulle barre segnano il minimo e il consigliato.\n4. Se il semaforo è giallo, segui le impostazioni consigliate."
features = ["Semaforo: gira bene, gira abbassando le impostazioni, troppo pesante", "Tre indicatori con minimo e consigliato", "Requisiti Steam e degli emulatori delle console", "Impostazioni consigliate per farlo girare meglio"]
permissions = ["rete:store.steampowered.com", "libreria:lettura", "avvio"]  # avvio: PowerShell (Windows), sysctl/system_profiler (macOS), lspci/nvidia-smi (Linux) per leggere CPU/GPU/RAM
api = 1
min_app = "0.20.2"
load = "lazy"
