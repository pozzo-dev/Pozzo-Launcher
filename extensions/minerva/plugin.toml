[plugin]
name = "Store Minerva + Switch"
version = "2.0"
author = "Pozzo Launcher"
icon = "⌂"
screenshot = "screenshot.png"
description = "Con un clic aggiunge allo Store online gli archivi Minerva di ogni console e gli store preimpostati Switch, Switch 2, PS4 e PS5; poi una scheda per console per leggere i giochi."
long_description = "«Importa store» aggiunge allo Store online di ogni console le cartelle di minerva-archive.org elencate dal progetto r-roms, più gli store preimpostati per Nintendo Switch (NXBrew, Ziperto), Switch 2 (NXBrew) e PlayStation 4 e 5 (superpsx). Non scarica nulla: ogni console ha la sua scheda con l'icona e il pulsante «Leggi», che scarica l'elenco dei giochi quando ti serve. Gli store che avevi già non vengono toccati."
how_it_works = "1. Installa l'estensione e apri «Store Minerva» nella barra laterale.\n2. Premi «Importa store».\n3. Premi «Leggi» sulla scheda della console che ti interessa, oppure «Leggi i mai letti».\n4. I giochi compaiono nello Store online della console."
features = ["Archivi Minerva per decine di console, con un clic", "Store preimpostati per Switch, Switch 2, PS4 e PS5", "Una scheda per console con giochi letti e «Leggi»", "Nessuno store già presente viene modificato"]
api = 1
min_app = "0.20.2"
permissions = ["rete:r-roms.github.io", "impostazioni", "file:lettura"]
load = "lazy"
