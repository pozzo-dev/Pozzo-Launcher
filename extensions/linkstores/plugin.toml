[plugin]
name = "Link → Store"
version = "2.0"
author = "Pozzo Launcher"
icon = "⇄"
screenshot = "screenshot.png"
description = "Da una pagina che raccoglie siti di giochi agli store dell'app, in tre passi: incolli l'indirizzo, scegli i link, decidi a quale console vanno."
long_description = "Incolla l'indirizzo di una pagina che elenca siti di giochi: l'estensione la legge e raggruppa i link per titolo di sezione. Scegli quelli che ti interessano, a gruppi o uno per uno, e per ogni gruppo la console di destinazione (proposta in base al titolo) o lo store PC. Con «Leggi subito» gli elenchi dei giochi si scaricano appena aggiunti."
how_it_works = "1. Installa l'estensione e apri «Link → Store» nella barra laterale.\n2. Incolla l'indirizzo della pagina e premi «Leggi la pagina».\n3. Scegli i link, a gruppi o uno per uno, e premi «Avanti».\n4. Controlla la console proposta per ogni gruppo e premi «Aggiungi»."
features = ["Procedura in tre passi", "Link raggruppati per sezione, da scegliere a gruppi", "Console proposta dal titolo del gruppo", "Lettura immediata degli store aggiunti"]
api = 1
min_app = "0.20.2"
permissions = ["rete:*", "impostazioni", "file:lettura", "file:scrittura"]
load = "lazy"
