[plugin]
name = "Notizie videogiochi"
version = "2.0"
author = "Pozzo Launcher"
icon = "≡"
screenshot = "screenshot.png"
description = "Le notizie di case e siti di videogiochi in una timeline, con il filtro «solo i miei giochi», la rassegna della settimana e i giochi da seguire per patch e DLC."
long_description = "Raccoglie in una timeline le notizie dai feed ufficiali delle case (Nintendo, PlayStation, Xbox, Valve, Capcom, Sega…) e dai principali siti. Ogni notizia è classificata (annuncio, patch, DLC, uscita) e si filtra per casa, per tipo o con la ricerca; «Solo i miei giochi e console» tiene solo quello che riguarda la tua libreria. Puoi seguire un gioco per vederne patch e DLC nella sua scheda e in uno scaffale della home, e ogni lunedì arriva la rassegna della settimana."
how_it_works = "1. Installa l'estensione e apri «Notizie» nella barra laterale.\n2. Filtra per casa o per tipo, oppure attiva «Solo i miei giochi e console».\n3. Nella scheda di un gioco premi «Segui» per averne patch e DLC.\n4. Ogni lunedì apri «Rassegna» per la settimana in breve."
features = ["Timeline di notizie da case e siti, classificate per tipo", "Filtro «solo i miei giochi e console»", "Giochi seguiti: patch e DLC nella scheda e in uno scaffale della home", "Rassegna della settimana ogni lunedì", "Fonti personalizzabili con i tuoi feed"]
api = 1
min_app = "0.20.2"
# niente load = "lazy": gs.job («rassegna-settimanale») deve partire con l'app
permissions = ["rete:blog.playstation.com", "rete:news.xbox.com", "rete:store.steampowered.com", "rete:www.nintendolife.com", "rete:www.nintendo-insider.com", "rete:www.nintendoeverything.com", "rete:www.siliconera.com", "rete:www.gematsu.com", "rete:www.eurogamer.net", "rete:www.gamesindustry.biz", "rete:retrododo.com", "rete:www.everyeye.it", "rete:www.spaziogames.it", "rete:api.steampowered.com", "rete:www.nintendo.co.jp", "rete:eu.finalfantasyxiv.com", "rete:*", "impostazioni", "libreria:lettura", "notifiche"]
