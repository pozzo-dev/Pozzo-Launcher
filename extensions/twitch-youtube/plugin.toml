[plugin]
name = "Twitch e YouTube"
version = "2.0.0"
author = "Pozzo Launcher"
icon = "▶"
description = "Nella scheda di ogni gioco i video YouTube (trailer e guide, da guardare lì) e chi lo sta trasmettendo in diretta su Twitch. Con le tue chiavi gratuite."
long_description = "Aggiunge alla scheda del gioco i video di YouTube (trailer e guide) da guardare senza uscire dall'app e le dirette Twitch in corso, con il numero di spettatori. Servono le tue chiavi gratuite, che si inseriscono in Impostazioni › Streaming › Dirette e video; finché non ci sono, la sezione spiega come ottenerle e offre comunque la ricerca su YouTube e Twitch."
how_it_works = "1. Installa l'estensione e apri la scheda di un gioco.\n2. Nella sezione «Dirette e video» premi «Attiva» e inserisci la chiave YouTube (e, se vuoi, quelle di Twitch).\n3. Riapri la scheda: trovi le anteprime dei video e delle dirette.\n4. Premi ▶ per guardare un video lì."
features = ["Trailer e guide YouTube da guardare nella scheda del gioco", "Dirette Twitch in corso con gli spettatori", "Senza chiavi: spiegazione e ricerca nel browser", "Chiavi tue e gratuite, nessun account nell'app"]
api = 2
min_app = "0.20.2"
permissions = ["rete:api.twitch.tv", "rete:id.twitch.tv", "rete:www.googleapis.com", "impostazioni"]
