[plugin]
name = "Pulizia libreria"
version = "2.1"
author = "Pozzo Launcher"
icon = "⌫"
screenshot = "screenshot.png"
description = "Quanto c'è da sistemare in un colpo d'occhio: doppioni, giochi mai avviati o fermi da anni, dati mancanti e file identici su disco, con azioni su più giochi insieme."
long_description = "In cima trovi un riquadro per ogni problema con il numero di giochi coinvolti. Aprine uno: le copertine si selezionano con un clic e le azioni (nascondi, abbandonato, da giocare) valgono per tutti i selezionati. I doppioni hanno il badge «DUP» anche nella libreria. «File identici» cerca copie dello stesso file in cartelle diverse e ti dice quanto spazio liberi, collegandole o eliminandole."
how_it_works = "1. Installa l'estensione e apri «Pulizia» nella barra laterale.\n2. Scegli un riquadro: Doppioni, Mai avviati, Fermi da anni, Dati mancanti o File identici.\n3. Seleziona le copertine e scegli un'azione in alto.\n4. Per i file identici scegli la copia da tenere, poi collega o elimina le altre."
features = ["Riquadri con quanto c'è da sistemare", "Copertine da selezionare e azioni su più giochi insieme", "Badge «DUP» sui doppioni nella libreria", "File identici su disco: spazio liberabile, collegamento o eliminazione"]
api = 1
min_app = "0.20.2"
permissions = ["libreria:lettura", "libreria:scrittura", "file:lettura", "file:scrittura"]
load = "lazy"
