[plugin]
name = "Obiettivi"
version = "2.0"
author = "Pozzo Launcher"
icon = "◎"
screenshot = "screenshot.png"
description = "Sfide proposte dalla tua libreria da accettare con un clic, obiettivi personali con anelli di avanzamento, serie di giorni e distintivi."
long_description = "Ti propone sfide su misura: finire un gioco che hai lasciato a metà, provare una console della tua libreria che non hai mai usato, giocare cinque giorni a settimana. Le accetti con un clic e vedi l'avanzamento su un anello. Puoi anche creare obiettivi tuoi (giochi finiti, ore o giorni di gioco nella settimana, nel mese o nell'anno), tenere viva la serie di giorni di fila e sbloccare i distintivi."
how_it_works = "1. Installa l'estensione e apri «Obiettivi» nella barra laterale.\n2. In «Sfide per te» premi «Accetta» su quelle che ti piacciono.\n3. L'avanzamento si aggiorna da solo con le partite e lo stato dei giochi.\n4. In «Obiettivo personalizzato» ne crei uno tuo."
features = ["Sfide proposte dalla tua libreria, accettate con un clic", "Obiettivi con anello di avanzamento", "Serie di giorni di fila e record", "Distintivi da sbloccare"]
api = 1
min_app = "0.20.2"
permissions = ["libreria:lettura", "impostazioni"]
load = "lazy"
