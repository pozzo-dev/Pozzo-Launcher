[plugin]
name = "Limite di tempo"
version = "2.1"
author = "Pozzo Launcher"
icon = "◔"
screenshot = "screenshot.png"
description = "Quanto hai giocato oggi e in settimana, con un limite al giorno o alla settimana: avviso 10 minuti prima e, se vuoi, il gioco si chiude da solo."
long_description = "Una pagina con il tempo di gioco di oggi su un anello, la settimana in un grafico con la linea del limite e le regole tutte insieme. Scegli le ore al giorno o alla settimana: 10 minuti prima arriva un avviso per salvare, e a tempo scaduto puoi scegliere se ricevere solo un avviso o far chiudere il gioco dopo un minuto. Conta le partite del profilo attivo."
how_it_works = "1. Installa l'estensione e apri «Tempo di gioco» nella barra laterale.\n2. In «Regole» scegli le ore al giorno o alla settimana.\n3. Scegli cosa succede a tempo scaduto: solo un avviso, o chiusura del gioco dopo un minuto.\n4. L'anello e il grafico mostrano quanto hai giocato e quanto resta."
features = ["Tempo di oggi su un anello e quanto resta", "Grafico della settimana con la linea del limite", "Avviso 10 minuti prima della fine", "A scelta: chiusura del gioco a tempo scaduto"]
api = 1
min_app = "0.20.2"
permissions = ["libreria:lettura", "impostazioni", "notifiche", "avvio"]
load = "lazy"
events = ["game_started", "game_stopped"]
