[plugin]
name = "SteamGridDB"
version = "2.0"
author = "Pozzo Launcher"
icon = "▣"
screenshot = "screenshot.png"
description = "Copertine verticali, sfondi, banner e loghi da SteamGridDB: completano i giochi senza immagini e arricchiscono il menu «Immagini del gioco…»."
long_description = "Con una chiave gratuita di steamgriddb.com recupera le immagini che mancano durante la ricerca dei metadati e porta nel menu «Immagini del gioco…» decine di copertine verticali, loghi trasparenti, sfondi e banner fatti dalla community, da scegliere con un clic."
how_it_works = "1. Installa l'estensione e prendi una chiave gratuita su steamgriddb.com.\n2. Inseriscila in Impostazioni › Estensioni › SteamGridDB.\n3. La ricerca dei metadati completa da sola le immagini che mancano.\n4. Tasto destro su un gioco › «Immagini del gioco…» per scegliere tra i candidati di SteamGridDB."
features = ["Copertine verticali ad alta risoluzione", "Sfondi, loghi trasparenti e icone", "Candidati da scegliere nel menu «Immagini del gioco…»", "Completa da solo le immagini mancanti"]
api = 1
min_app = "0.20.2"
permissions = ["rete:www.steamgriddb.com", "rete:cdn2.steamgriddb.com", "impostazioni"]
