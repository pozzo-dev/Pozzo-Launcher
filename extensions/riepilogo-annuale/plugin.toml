[plugin]
name = "Il tuo anno"
version = "2.0"
author = "Pozzo Launcher"
icon = "✦"
screenshot = "screenshot.png"
description = "Il tuo anno di gioco raccontato come una storia a schermo intero: ore, gioco dell'anno, classifica, abitudini e record, con un'immagine da condividere."
long_description = "Una storia animata a schede, come i riepiloghi di fine anno delle app di musica: quante ore hai giocato, il tuo gioco dell'anno con la sua copertina, i cinque più giocati, la console e il mese preferiti, la sessione più lunga e i giochi finiti. Alla fine puoi salvare un'immagine da condividere. I numeri completi restano nella pagina Statistiche dell'app."
how_it_works = "1. Installa l'estensione e apri «Il tuo anno» nella barra laterale.\n2. Scegli l'anno in alto.\n3. Premi «Guarda il tuo anno»: le schede scorrono da sole; frecce o clic a destra e a sinistra per andare avanti e indietro, Esc per uscire.\n4. Nell'ultima scheda salvi l'immagine o apri le Statistiche."
features = ["Storia a schermo intero con schede animate", "Gioco dell'anno e classifica con le copertine", "Console, mese e giorno preferiti, sessione più lunga", "Immagine da condividere con i colori del tuo tema"]
api = 1
min_app = "0.20.2"
permissions = ["libreria:lettura"]
load = "lazy"
