[plugin]
name = "Anniversari retro"
version = "2.1"
author = "Pozzo Launcher"
icon = "◷"
screenshot = "screenshot.png"
description = "I giochi della tua libreria che compiono gli anni oggi e nei prossimi giorni: badge sulle copertine, uno scaffale in home e una pagina giorno per giorno."
long_description = "Ogni giorno confronta la data di oggi con le date di uscita dei tuoi giochi. Chi compie gli anni oggi ha un badge sulla copertina («30 ANNI») e uno scaffale nella home; la pagina Anniversari mostra le copertine dei festeggiati di oggi e dei prossimi 30 giorni, con le cifre tonde in evidenza."
how_it_works = "1. Installa l'estensione.\n2. Servono le date di uscita complete (giorno, mese e anno): arrivano con la ricerca dei metadati.\n3. Apri «Anniversari» nella barra laterale: oggi in alto, poi i prossimi 30 giorni.\n4. Clicca una copertina per aprire il gioco e festeggiarlo."
features = ["Badge «N ANNI» sulle copertine dei festeggiati di oggi", "Scaffale «Compiono gli anni» nella home", "Pagina con oggi e i prossimi 30 giorni, giorno per giorno", "Cifre tonde (10, 20, 25, 30…) in evidenza"]
api = 1
min_app = "0.20.2"
permissions = ["libreria:lettura"]
load = "lazy"
