[plugin]
name = "Calendario uscite"
version = "2.0"
author = "Pozzo Launcher"
icon = "▦"
screenshot = "screenshot.png"
description = "Le prossime uscite in un calendario mese per mese, con copertine: prima i giochi della tua lista dei desideri, poi i più attesi dei generi che giochi di più."
long_description = "Un calendario per ogni mese con le copertine dei giochi in uscita nei prossimi sei mesi. In cima trovi i giochi della tua lista dei desideri con il conto alla rovescia; sotto, i titoli più attesi dei generi che giochi di più (oppure di tutti i generi). Con un clic aggiungi un gioco alla lista dei desideri. Usa la chiave RAWG già impostata nell'app."
how_it_works = "1. Installa l'estensione.\n2. Serve la chiave gratuita di RAWG in Impostazioni › Libreria e fonti (la stessa usata per i metadati).\n3. Apri «Calendario uscite» nella barra laterale.\n4. Clicca un giorno del calendario per vedere le sue uscite, e «Desideri» per seguire un gioco."
features = ["Calendario mese per mese con le copertine", "Prima i giochi della tua lista dei desideri, con il conto alla rovescia", "Filtro: i tuoi generi preferiti o tutti", "Aggiunta alla lista dei desideri con un clic"]
api = 1
min_app = "0.20.2"
permissions = ["rete:api.rawg.io", "rete:media.rawg.io", "libreria:lettura", "libreria:scrittura", "impostazioni"]
load = "lazy"
