[plugin]
name = "Media locale"
version = "1.1"
author = "Pozzo Launcher"
icon = "🎬"
description = "Film, serie e musica che hai già sul disco, sfogliati come una libreria: nomi riconosciuti alla maniera di Jellyfin/Plex, poster locali, ripresa da dove eri rimasto."
long_description = "Trasforma una o più cartelle del tuo PC in una libreria di film, serie e musica dentro Pozzo Launcher. La scansione riconosce i nomi più comuni («Film (2020).mkv», «Serie/Season 01/S01E02 - Titolo.mkv», «Artista/Album/01 - Titolo.flac») e i poster locali (poster.jpg, folder.jpg). I contenuti che la finestra sa leggere partono nel lettore integrato, gli altri si aprono nel lettore predefinito del sistema. Scansione, posizione di riproduzione e stato «visto» restano sul tuo PC, separati dalla libreria dei giochi. Va in rete solo se lo chiedi: «Scarica locandine» cerca titoli e anni su TMDb e AniList. La stessa pagina mostra anche i server Jellyfin/Plex e i cataloghi web se installi Media server o Ricette web."
how_it_works = "1. Installa l'estensione e apri «Media» dalla barra laterale.\n2. Premi ⚙ Impostazioni Media e aggiungi le cartelle di film, serie o musica.\n3. Avvia la scansione: i file vengono riconosciuti dal nome e dalle cartelle.\n4. Apri un contenuto per riprodurlo; la posizione si salva da sola e riaprendo riprendi da dove eri.\n5. I formati che la finestra non legge (es. mkv) si aprono nel lettore esterno del sistema (mpv, VLC o quello predefinito)."
features = [
  "Più cartelle di film, serie e musica, scelte da te",
  "Riconoscimento dei nomi alla maniera di Jellyfin/Plex, con stagioni ed episodi",
  "Poster locali (poster.jpg, folder.jpg) mostrati nella griglia",
  "Ripresa automatica da dove eri rimasto e stato «visto» oltre il 90%",
  "Lettore integrato per i formati del browser, lettore esterno per gli altri",
  "Archivio separato: i media non entrano nella libreria dei giochi",
  "In rete solo su richiesta: locandine e trame da TMDb e AniList"
]
api = 2
min_app = "0.20.2"
permissions = ["media:lettura", "avvio", "impostazioni"]
