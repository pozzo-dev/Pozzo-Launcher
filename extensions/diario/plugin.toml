[plugin]
name = "Diario di gioco"
version = "2.0"
author = "Pozzo Launcher"
icon = "✎"
screenshot = "screenshot.png"
description = "La storia di ogni gioco giorno per giorno: partite, note datate, schermate e copie dei salvataggi in un'unica linea del tempo nella scheda del gioco."
long_description = "Nella scheda di ogni gioco compare il Diario: una linea del tempo, giorno per giorno, che mette insieme le partite registrate da Pozzo, le note che scrivi (a che punto sei, un trucco, una password), le schermate e le copie dei salvataggi. In alto vedi il tempo totale e quante volte hai giocato. Tutto resta sul tuo PC."
how_it_works = "1. Installa l'estensione e apri la scheda di un gioco.\n2. Nella sezione «Diario» scrivi una nota e premi «Aggiungi»: finisce nel giorno di oggi.\n3. Partite, schermate e salvataggi compaiono da soli, nel giorno in cui sono successi."
features = ["Linea del tempo per giorno nella scheda del gioco", "Note datate: progressi, trucchi, password", "Partite, schermate e copie dei salvataggi insieme", "Tempo totale e numero di partite in alto"]
api = 1
min_app = "0.20.2"
permissions = ["libreria:lettura", "impostazioni"]
load = "lazy"
