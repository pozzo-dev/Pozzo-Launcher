[plugin]
name = "Ricette web"
version = "1.1"
author = "Pozzo Launcher"
icon = "🌐"
description = "Film, serie e podcast da siti e feed aperti con ricette TOML (senza codice), più addon Kodi e Stream4me facoltativi che invece eseguono codice sul tuo PC."
long_description = "Le «ricette» sono file TOML dichiarativi: dicono dove leggere titoli, copertine ed episodi in pagine HTML, feed RSS e dati JSON. Non contengono codice e possono contattare solo l'host che dichiarano, rispettando robots.txt, con cache su disco e limiti di frequenza. Sono incluse quelle per i film di pubblico dominio di Internet Archive e i podcast della NASA. In più, dalle impostazioni di Media puoi installare Stream4me e altri addon Kodi: sono programmi Python di terze parti che vengono eseguiti sul tuo PC con i tuoi permessi e possono collegarsi a qualsiasi sito. Installa solo addon di cui ti fidi; i contenuti che offrono vengono da siti di terzi ed è tua responsabilità poterli guardare."
how_it_works = "1. Installa l'estensione e apri «Ricette web» dalla barra laterale.\n2. Scegli una sorgente (Internet Archive, NASA…) o cerca un titolo.\n3. Apri una scheda per descrizione, copertina ed episodi, poi premi ▶.\n4. «Anteprima ricetta» mostra come viene letto il sito.\n5. Facoltativo: in Media › ⚙ Impostazioni Media puoi installare Stream4me o un addon Kodi. Sono codice di terze parti eseguito sul tuo PC: installa solo quelli di cui ti fidi."
features = [
  "Ricette TOML dichiarative: nessun codice, solo l'host dichiarato",
  "Incluse: film di pubblico dominio di Internet Archive e podcast NASA",
  "Sorgenti HTML (selettori CSS), feed RSS/XML e API JSON",
  "Cache su disco, limiti di frequenza e rispetto di robots.txt",
  "Pagina con griglia, ricerca, episodi e ripresa della riproduzione",
  "Addon Kodi e Stream4me facoltativi: codice di terze parti eseguito sul PC, senza limiti di rete"
]
api = 2
min_app = "0.20.2"
permissions = ["rete:archive.org", "rete:www.nasa.gov"]
